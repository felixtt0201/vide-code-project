<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專案管理追蹤事項</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <h1>專案管理追蹤事項</h1>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Overview View -->
    <section id="overview" class="view">
      <div class="container">
        <!-- Project Info Card -->
        <div class="card project-info">
          <h2>專案資訊</h2>
          <p><strong>名稱：</strong> <span id="projectName"></span></p>
          <p><strong>建立日期：</strong> <span id="projectCreated"></span></p>
          <p><strong>預計完成：</strong> <span id="projectTarget"></span></p>
        </div>

        <!-- Progress Card -->
        <div class="card progress-card">
          <h2>專案進度</h2>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <p id="progressText" class="progress-text"></p>
        </div>

        <!-- Status Statistics -->
        <div class="card status-stats">
          <h2>狀態統計</h2>
          <div class="stats-grid">
            <div class="stat">
              <div class="stat-count" id="countPending">0</div>
              <div class="stat-label">待處理</div>
            </div>
            <div class="stat">
              <div class="stat-count" id="countInProgress">0</div>
              <div class="stat-label">進行中</div>
            </div>
            <div class="stat">
              <div class="stat-count" id="countCompleted">0</div>
              <div class="stat-label">已完成</div>
            </div>
          </div>
        </div>

        <!-- Urgent Tasks -->
        <div class="card urgent-tasks">
          <h2>即將到期事項</h2>
          <div id="urgentList"></div>
        </div>

        <button id="viewAllBtn" class="btn btn-primary">查看所有事項</button>
      </div>
    </section>

    <!-- List View -->
    <section id="list" class="view hidden">
      <div class="container">
        <button id="backBtn" class="btn btn-secondary">返回總覽</button>

        <!-- Filter Buttons -->
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="待處理">待處理</button>
          <button class="filter-btn" data-filter="進行中">進行中</button>
          <button class="filter-btn" data-filter="已完成">已完成</button>
        </div>

        <p id="filterText" class="filter-text">顯示所有事項</p>

        <!-- Tasks Table -->
        <table class="table">
          <thead>
            <tr>
              <th>事項</th>
              <th>負責人</th>
              <th>優先級</th>
              <th>狀態</th>
              <th>期限</th>
            </tr>
          </thead>
          <tbody id="taskList"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button id="closeModal" class="btn-close">×</button>
      <h2 id="modalTitle"></h2>
      <div class="modal-body">
        <p><strong>負責人：</strong> <span id="modalAssignee"></span></p>
        <p><strong>優先級：</strong> <span id="modalPriority"></span></p>
        <p><strong>狀態：</strong> <span id="modalStatus"></span></p>
        <p><strong>預計完成日期：</strong> <span id="modalDueDate"></span></p>
        <p><strong>建立日期：</strong> <span id="modalCreatedDate"></span></p>
        <p><strong>備註：</strong></p>
        <p id="modalDescription"></p>
      </div>
    </div>
  </div>
