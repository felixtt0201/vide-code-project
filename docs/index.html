<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM 工作管理系統</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <h1>PM 工作管理系統</h1>
      <p class="subtitle">今天是 <span id="todayDate"></span></p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Today View -->
    <section id="todayView" class="view">
      <div class="container">
        
        <!-- Overdue Section -->
        <section class="card overdue-section">
          <h2>🔴 逾期事項 <span class="badge" id="overdueCount">0</span></h2>
          <div id="overdueList" class="task-list"></div>
        </section>

        <!-- Today Tasks Section -->
        <section class="card today-section">
          <h2>🟠 今日需要處理 <span class="badge" id="todayCount">0</span></h2>
          <div id="todayList" class="task-list"></div>
        </section>

        <!-- Waiting Section -->
        <section class="card waiting-section">
          <h2>🔵 等待他人 <span class="badge" id="waitingCount">0</span></h2>
          <div id="waitingList" class="waiting-group-list"></div>
        </section>

        <!-- Project Progress Section -->
        <section class="card progress-section">
          <h2>📊 專案進度</h2>
          <div id="projectProgressList" class="progress-list"></div>
        </section>

        <!-- All Tasks Section (Hidden) -->
        <section id="allTasksView" class="card hidden">
          <h2>所有追蹤事項</h2>
          <div class="search-filter-bar">
            <input type="text" id="searchInput" placeholder="搜尋事項名稱...">
            <select id="statusFilter" class="filter-select">
              <option value="">全部狀態</option>
              <option value="待處理">待處理</option>
              <option value="進行中">進行中</option>
              <option value="等待他人">等待他人</option>
              <option value="已完成">已完成</option>
            </select>
            <select id="priorityFilter" class="filter-select">
              <option value="">全部優先級</option>
              <option value="高">高</option>
              <option value="中">中</option>
              <option value="低">低</option>
            </select>
            <select id="projectFilter" class="filter-select">
              <option value="">全部專案</option>
            </select>
          </div>
          <div id="allTasksList" class="task-list"></div>
        </section>

      </div>
    </section>
  </main>

  <!-- Floating Action Buttons -->
  <div class="fab-container">
    <button id="fabAdd" class="fab-button" title="新增">+</button>
    <div id="fabMenu" class="fab-menu hidden">
      <button id="addProjectBtn" class="fab-menu-item" data-action="addProject">+ 新增專案</button>
      <button id="addFeatureBtn" class="fab-menu-item" data-action="addFeature">+ 新增功能</button>
      <button id="addTaskBtn" class="fab-menu-item" data-action="addTask">+ 新增追蹤事項</button>
    </div>
  </div>

  <!-- Modals -->
  
  <!-- Add Project Modal -->
  <div id="addProjectModal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close">×</button>
      <h2>新增專案</h2>
      <form id="addProjectForm">
        <div class="form-group">
          <label>專案名稱 *</label>
          <input type="text" id="projectName" required>
        </div>
        <div class="form-group">
          <label>專案描述</label>
          <textarea id="projectDescription"></textarea>
        </div>
        <div class="form-group">
          <label>狀態 *</label>
          <select id="projectStatus" required>
            <option value="未開始">未開始</option>
            <option value="進行中">進行中</option>
            <option value="暫停">暫停</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
        <div class="form-group">
          <label>開始日期</label>
          <input type="date" id="projectStartDate">
        </div>
        <div class="form-group">
          <label>預計完成日期</label>
          <input type="date" id="projectTargetDate">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">保存</button>
          <button type="button" class="btn-secondary modal-close">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Feature Modal -->
  <div id="addFeatureModal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close">×</button>
      <h2>新增功能</h2>
      <form id="addFeatureForm">
        <div class="form-group">
          <label>所屬專案 *</label>
          <select id="featureProjectSelect" required></select>
        </div>
        <div class="form-group">
          <label>功能名稱 *</label>
          <input type="text" id="featureName" required>
        </div>
        <div class="form-group">
          <label>功能描述</label>
          <textarea id="featureDescription"></textarea>
        </div>
        <div class="form-group">
          <label>狀態 *</label>
          <select id="featureStatus" required>
            <option value="未開始">未開始</option>
            <option value="進行中">進行中</option>
            <option value="等待他人">等待他人</option>
            <option value="已完成">已完成</option>
          </select>
        </div>
        <div class="form-group">
          <label>優先級</label>
          <select id="featurePriority">
            <option value="低">低</option>
            <option value="中">中</option>
            <option value="高">高</option>
          </select>
        </div>
        <div class="form-group">
          <label>預計完成日期</label>
          <input type="date" id="featureTargetDate">
        </div>
        <div class="form-group">
          <label>負責人</label>
          <input type="text" id="featureAssignee">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">保存</button>
          <button type="button" class="btn-secondary modal-close">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Task Modal -->
  <div id="addTaskModal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-lg">
      <button class="modal-close">×</button>
      <h2>新增追蹤事項</h2>
      <form id="addTaskForm">
        <div class="form-group">
          <label>所屬專案 *</label>
          <select id="taskProjectSelect" required></select>
        </div>
        <div class="form-group">
          <label>所屬功能 *</label>
          <select id="taskFeatureSelect" required></select>
        </div>
        <div class="form-group">
          <label>事項名稱 *</label>
          <input type="text" id="taskName" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>優先級</label>
            <select id="taskPriority">
              <option value="低">低</option>
              <option value="中">中</option>
              <option value="高">高</option>
            </select>
          </div>
          <div class="form-group">
            <label>狀態</label>
            <select id="taskStatus">
              <option value="待處理">待處理</option>
              <option value="進行中">進行中</option>
              <option value="等待他人">等待他人</option>
              <option value="已完成">已完成</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>預計完成日期</label>
          <input type="date" id="taskDueDate">
        </div>
        <div class="form-group">
          <label>Next Action</label>
          <textarea id="taskNextAction" placeholder="下一步實際要做什麼..."></textarea>
        </div>
        <div class="form-group">
          <label>負責人</label>
          <input type="text" id="taskAssignee">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">保存</button>
          <button type="button" class="btn-secondary modal-close">取消</button>
        </div>
      </form>
    </div>
  </div>
